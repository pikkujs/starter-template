name: CI

# The pikku checks (bootstrap, all, app build, validate, audit, test, tsc) live in checks.yml, a call to the
# reusable pikku-checks workflow. This file keeps what that workflow does not do: lint, format, unit tests and
# the standalone build + boot smoke test.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Unit tests
        run: bun test --pass-with-no-tests

      - name: Standalone build
        run: |
          # Standalone cannot host the ssr frontend (it deploys through cloud), so build the backend from a throwaway config without it.
          jq '.frontends.app.deploy = false' pikku.config.json > pikku.ci.config.json
          bunx --bun pikku deploy apply -p standalone --runtime bun --config pikku.ci.config.json

      - name: Standalone boots
        working-directory: .deploy/standalone/root-dist
        env:
          PORT: '3000'
          PIKKU_DATA_DIR: ${{ runner.temp }}/pikku-data
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789
        run: |
          mkdir -p "$PIKKU_DATA_DIR"
          ./root db migrate
          ./root > "$RUNNER_TEMP/standalone.log" 2>&1 &
          if ! curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3000/api/auth/get-session; then
            cat "$RUNNER_TEMP/standalone.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .deploy/standalone/root-dist.zip
