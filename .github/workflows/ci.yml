name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run tsc

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Unit tests
        run: bun test --pass-with-no-tests

      - name: Standalone build
        working-directory: packages/functions
        run: |
          # Standalone cannot host the ssr frontend (it deploys through cloud), so build the backend from a throwaway config without it.
          jq '.frontends.app.deploy = false' pikku.config.json > pikku.ci.config.json
          bunx --bun pikku deploy apply -p standalone --runtime bun --config pikku.ci.config.json

      - name: Standalone boots
        working-directory: packages/functions/.deploy/standalone/functions-dist
        env:
          PORT: '3000'
          PIKKU_DATA_DIR: ${{ runner.temp }}/pikku-data
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789
        run: |
          mkdir -p "$PIKKU_DATA_DIR"
          ./functions db migrate
          ./functions > "$RUNNER_TEMP/standalone.log" 2>&1 &
          if ! curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3000/api/auth/get-session; then
            cat "$RUNNER_TEMP/standalone.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: packages/functions/.deploy/standalone/functions-dist.zip
