name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_starter
      PIKKU_API_URL: http://localhost:4003

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Generate Pikku clients
        run: yarn pikku all

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: yarn workspace @project/e2e exec playwright install --with-deps chromium

      - name: Seed database
        run: |
          cp packages/functions/.env.example packages/functions/.env
          yarn dbmigrate

      - name: Start backend
        run: |
          yarn dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:4003/hello -H 'content-type: application/json' -d '{}' >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Start react-vite-mantine
        run: |
          PIKKU_API_URL=$PIKKU_API_URL \
            yarn workspace @project/app-react-vite-mantine dev --port 5173 \
            > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "vite ready"
              exit 0
            fi
            sleep 1
          done
          echo "vite failed to start"
          cat /tmp/vite.log
          exit 1

      - name: Run e2e (react-vite-mantine)
        env:
          APP_URL: http://localhost:5173
          APP_SOURCE: client:react-vite
          APP_SSR: '0'
        run: yarn workspace @project/e2e test

      - name: Upload e2e reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            e2e/tests/reports
            /tmp/backend.log
            /tmp/vite.log
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          [ -f /tmp/vite.pid ] && kill $(cat /tmp/vite.pid) 2>/dev/null || true
          [ -f /tmp/backend.pid ] && kill $(cat /tmp/backend.pid) 2>/dev/null || true
