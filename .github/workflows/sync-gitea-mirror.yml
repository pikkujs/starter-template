name: Sync Gitea mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-gitea-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mirror sync
        env:
          GITEA_MIRROR_SYNC_TOKEN: ${{ secrets.GITEA_MIRROR_SYNC_TOKEN }}
        run: |
          if [ -z "$GITEA_MIRROR_SYNC_TOKEN" ]; then
            echo "GITEA_MIRROR_SYNC_TOKEN is not set" >&2
            exit 1
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/response.txt" -w '%{http_code}' \
            --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: token ${GITEA_MIRROR_SYNC_TOKEN}" \
            https://git.pikkustudio.app/api/v1/repos/pikkustudio/starter-template/mirror-sync)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Mirror sync failed with HTTP $status" >&2
            cat "$RUNNER_TEMP/response.txt" >&2
            exit 1
          fi
          echo "Mirror sync triggered (HTTP $status)"
